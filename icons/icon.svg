<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="felt" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#14894a"/>
      <stop offset="0.6" stop-color="#0a5b2d"/>
      <stop offset="1" stop-color="#063d1e"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3eedf"/>
    </linearGradient>
    <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7c948"/>
      <stop offset="1" stop-color="#d9900f"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <g id="bg">
    <rect width="512" height="512" rx="112" fill="url(#felt)"/>
    <rect x="22" y="22" width="468" height="468" rx="92" fill="none" stroke="#e4c46a" stroke-opacity="0.7" stroke-width="6"/>
  </g>
  <g id="content">
    <!-- back card: K hearts -->
    <g transform="rotate(-14 210 300)" filter="url(#sh)">
      <rect x="112" y="128" width="190" height="262" rx="22" fill="url(#card)"/>
      <text x="134" y="186" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="56" fill="#c62828">K</text>
      <text x="137" y="232" font-family="'Segoe UI Symbol', 'DejaVu Sans', sans-serif" font-size="44" fill="#c62828">♥</text>
    </g>
    <!-- front card: A spades -->
    <g transform="rotate(10 300 300)" filter="url(#sh)">
      <rect x="214" y="122" width="190" height="262" rx="22" fill="url(#card)"/>
      <text x="236" y="180" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="56" fill="#111">A</text>
      <text x="309" y="300" text-anchor="middle" font-family="'Segoe UI Symbol', 'DejaVu Sans', sans-serif" font-size="120" fill="#111">♠</text>
    </g>
    <!-- shot glass -->
    <g filter="url(#sh)">
      <path d="M318 318 L414 318 L402 430 Q401 440 391 440 L341 440 Q331 440 330 430 Z" fill="#ffffff" fill-opacity="0.28" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
      <path d="M326 350 L406 350 L398 426 Q397 432 391 432 L341 432 Q335 432 334 426 Z" fill="url(#beer)"/>
      <rect x="326" y="342" width="80" height="12" rx="6" fill="#fffdf7"/>
    </g>
    <!-- 21 chip -->
    <g filter="url(#sh)">
      <circle cx="140" cy="390" r="58" fill="#c62828"/>
      <circle cx="140" cy="390" r="58" fill="none" stroke="#fffdf7" stroke-width="12" stroke-dasharray="18 12.37"/>
      <circle cx="140" cy="390" r="40" fill="#b71c1c" stroke="#e4c46a" stroke-width="4"/>
      <text x="140" y="405" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="42" fill="#fffdf7">21</text>
    </g>
  </g>
</svg>
